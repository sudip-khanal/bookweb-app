name: CI

on:
  workflow_dispatch:

env:
  IMAGE_NAME: exampledjango-app
  HELM_RELEASE_NAME: django-app
  HELM_NAMESPACE: default
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to DockerHub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v2
      with:
        context: .
        push: true
        tags: ${{ github.actor }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

    - name: Set up Helm
      uses: azure/setup-helm@v1
      with:
        version: v3.7.0

    - name: Configure Kubernetes Access
      run: |
        echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig
        export KUBECONFIG=kubeconfig

    - name: Deploy to Kubernetes with Helm
      run: |
        helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ./helm-chart --namespace ${{ env.HELM_NAMESPACE }} --set image.repository=${{ github.actor }}/${{ env.IMAGE_NAME }} --set image.tag=${{ github.run_number }}
        
    - name: Notify ArgoCD (optional)
      uses: peter-evans/repository-dispatch@v1
      with:
        token: ${{ secrets.PAT }}
        repository: ${{ github.actor }}/argocd-django-app-config
        event-type: new-image
        client-payload: '{"image": "${{ github.actor }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}"}'
